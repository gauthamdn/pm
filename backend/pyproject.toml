[project]
name = "kanban-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["fastapi", "uvicorn"]

[dependency-groups]
dev = ["httpx2", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
